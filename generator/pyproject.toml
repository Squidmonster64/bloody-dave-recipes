[project]
name = "bd-recipe-studio"
version = "1.0.0"
description = "Bloody Dave Recipe Studio generator service"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.32.0",
  "httpx>=0.27.0",
  "beautifulsoup4>=4.12.0",
  "lxml>=5.0.0",
  "pydantic>=2.7.0",
  "Pillow>=10.0.0",
  "reportlab>=4.2.0",
  "pypdf>=5.0.0",
  "qrcode>=8.0",
  "openai>=1.50.0",
  "python-multipart>=0.0.9",
  "itsdangerous>=2.2.0",
  "pymupdf>=1.24.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0.0"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]
